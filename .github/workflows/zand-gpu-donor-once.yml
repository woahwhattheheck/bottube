      - zc913425/bottube-truthful-ci-source-recovery-20260913
    paths:
      - .github/workflows/zand-gpu-donor-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zc913425/bottube-truthful-ci-source-recovery-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact GPU state-machine refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path('gpu_marketplace.py')
          text = path.read_bytes().decode('utf-8')

          helper_anchor = '''    db.commit()
