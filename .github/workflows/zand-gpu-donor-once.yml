              '        "message": f"Job completed! Earned {payment:.6f} RTC"',
              '    })',
              '',
              '',
          ])
          replace_block("@gpu_bp.route('/jobs/complete', methods=['POST'])", "@gpu_bp.route('/jobs/fail', methods=['POST'])", complete_block)

          fail_block = crlf.join([
              "@gpu_bp.route('/jobs/fail', methods=['POST'])",
              '@require_gpu_api_key',
              'def fail_job():',
