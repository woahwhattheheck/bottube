              '',
              '    if not _start_gpu_job_transaction(db, provider_id, job_id, int(time.time())):',
              '        return jsonify({"error": "Job state changed concurrently or not claimed"}), 409',
              '',
              '    return jsonify({"ok": True, "status": "running"})',
              '',
              '',
          ])
          replace_block("@gpu_bp.route('/jobs/start', methods=['POST'])", "@gpu_bp.route('/jobs/complete', methods=['POST'])", start_block)

          complete_block = crlf.join([
              "@gpu_bp.route('/jobs/complete', methods=['POST'])",
              '@require_gpu_api_key',
              'def complete_job():',
              '    """Mark a job as completed and receive payment.',
              '',
              '    Body:',
              '        provider_id: str',
              '        job_id: str',
              '        result_url: str (optional) - URL to the rendered output',
              '    """',
              '    agent = g.agent',
              '    data, error = _json_object()',
              '    if error:',
              '        return error',
              '',
              '    provider_id, error = _coerce_string(data.get("provider_id"), "provider_id")',
              '    if error:',
              '        return error',
              '    job_id, error = _coerce_string(data.get("job_id"), "job_id")',
              '    if error:',
              '        return error',
              '    result_url, error = _coerce_string(data.get("result_url"), "result_url")',
              '    if error:',
              '        return error',
              '',
              '    db = get_db()',
              '',
              '    row = db.execute("""',
              '        SELECT j.status, j.provider_id, j.started_at, j.rtc_escrowed, j.requester_id,',
              '               p.agent_id, p.price_per_min',
              '        FROM gpu_jobs j',
              '        JOIN gpu_providers p ON j.provider_id = p.id',
              '        WHERE j.id = ?',
              '    """, (job_id,)).fetchone()',
              '',
              '    if not row:',
              '        return jsonify({"error": "Job not found"}), 404',
              "    if row[5] != agent['id']:",
              '        return jsonify({"error": "Not your job"}), 403',
              '    if row[0] != "running":',
              '        return jsonify({"error": f"Job not running (status: {row[0]})"}), 400',
              '',
              '    now = int(time.time())',
              '    duration_mins = (now - row[2]) / 60.0',
              '    payment = min(duration_mins * row[6], row[3])',
              '',
              '    if not _complete_gpu_job_transaction(',
              '        db,',
              '        job_id=job_id,',
              '        provider_id=provider_id,',
              '        now=now,',
              '        duration_mins=duration_mins,',
