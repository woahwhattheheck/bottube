def get_db():'''
          helpers = '''    db.commit()
    return "claimed"


def _start_gpu_job_transaction(db, provider_id: str, job_id: str, now: int) -> bool:
    """Atomically transition one provider-owned claimed job to running."""
    cursor = db.execute(
        """
        UPDATE gpu_jobs
        SET status = 'running', started_at = ?
        WHERE id = ? AND provider_id = ? AND status = 'claimed'
        """,
        (now, job_id, provider_id),
    )
    if int(getattr(cursor, "rowcount", 0) or 0) <= 0:
        db.rollback()
        return False
    db.commit()
    return True


def _complete_gpu_job_transaction(
    db,
    *,
    job_id: str,
    provider_id: str,
    now: int,
    duration_mins: float,
    payment: float,
    result_url: str,
) -> bool:
    """Exactly-once completion, provider credit, and history publication."""
    cursor = db.execute(
        """
        UPDATE gpu_jobs
        SET status = 'completed', completed_at = ?, actual_mins = ?, rtc_paid = ?, result_url = ?
        WHERE id = ? AND provider_id = ? AND status = 'running'
        """,
        (now, duration_mins, payment, result_url, job_id, provider_id),
    )
    if int(getattr(cursor, "rowcount", 0) or 0) <= 0:
        db.rollback()
        return False

    db.execute(
        """
        UPDATE gpu_providers
        SET status = 'online', total_jobs = total_jobs + 1,
            total_rtc_earned = total_rtc_earned + ?
        WHERE id = ?
        """,
        (payment, provider_id),
    )
    db.execute(
        """
        INSERT INTO gpu_job_history
            (job_id, provider_id, requester_id, job_type, status,
             rtc_amount, duration_mins, completed_at)
        SELECT id, provider_id, requester_id, job_type, 'completed', ?, ?, ?
        FROM gpu_jobs WHERE id = ?
        """,
        (payment, duration_mins, now, job_id),
    )
    db.commit()
    return True


def _release_gpu_job_transaction(db, provider_id: str, job_id: str, error_message: str) -> bool:
    """Atomically return one claimed/running job to pending and free its provider."""
    cursor = db.execute(
        """
        UPDATE gpu_jobs
        SET status = 'pending', provider_id = NULL, claimed_at = NULL,
            started_at = NULL, error_message = ?
        WHERE id = ? AND provider_id = ? AND status IN ('claimed', 'running')
        """,
        (error_message, job_id, provider_id),
    )
    if int(getattr(cursor, "rowcount", 0) or 0) <= 0:
        db.rollback()
        return False

    db.execute(
        "UPDATE gpu_providers SET status = 'online' WHERE id = ?",
        (provider_id,),
    )
    db.commit()
    return True


def get_db():'''
          assert text.count(helper_anchor) == 1, 'helper anchor drift'
          text = text.replace(helper_anchor, helpers, 1)

          def replace_block(start_marker, end_marker, replacement):
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          crlf = '\r\n'
          start_block = crlf.join([
              "@gpu_bp.route('/jobs/start', methods=['POST'])",
              '@require_gpu_api_key',
              'def start_job():',
              '    """Mark a claimed job as started (running).',
              '',
              '    Body:',
              '        provider_id: str',
              '        job_id: str',
              '    """',
              '    agent = g.agent',
              '    data, error = _json_object()',
              '    if error:',
              '        return error',
              '',
              '    provider_id, error = _coerce_string(data.get("provider_id"), "provider_id")',
              '    if error:',
              '        return error',
              '    job_id, error = _coerce_string(data.get("job_id"), "job_id")',
              '    if error:',
