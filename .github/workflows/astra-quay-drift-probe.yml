name: ASTRA-QUAY inventory counts

on:
  push:
    branches: [diagnostics/astra-quay-drift-20260907]
    paths: [.github/workflows/astra-quay-drift-probe.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/bottube
          ref: 6b1a4d4a297a14991796e5b8f11405df4eb71db9
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --timeout 30 'PyYAML==6.0.3'
      - name: Exact offline inventory reports
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          from deployment_drift import build_report, load_config
          root = Path.cwd().resolve()
          for name in ('deployment-drift.json', 'deployment-drift.issue-1410.example.json'):
              report = build_report(root, load_config(root / name))
              print(name, json.dumps({key: report[key] for key in ('inventory', 'status', 'exit_code', 'blocking', 'stale_allowances')}, sort_keys=True))
              assert report['exit_code'] == 0
          PY
