name: ASTRA-QUAY PR2207 drift diagnosis

on:
  push:
    branches: [diagnostics/astra-quay-drift-20260907]
    paths: [.github/workflows/astra-quay-drift-probe.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/bottube
          ref: 87251dcb81e946b40a8e55138be21c1f3863c174
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated drift dependencies
        run: python -m pip install --timeout 30 'pytest==9.1.1' 'PyYAML==6.0.3'
      - name: Exact source and offline diagnostic reports
        run: |
          test "$(git rev-parse HEAD)" = 87251dcb81e946b40a8e55138be21c1f3863c174
          mkdir -p diagnosis
          python - <<'PY'
          import json
          from pathlib import Path
          from deployment_drift import build_report, load_config
          root = Path.cwd()
          for name in ('deployment-drift.json', 'deployment-drift.issue-1410.example.json'):
              report = build_report(root, load_config(root / name))
              (root / 'diagnosis' / name).write_text(json.dumps(report, indent=2) + '\n')
              print(json.dumps({'config': name, 'status': report['status'], 'exit_code': report['exit_code'], 'inventory': report['inventory'], 'blocking': report['blocking'], 'stale_allowances': report['stale_allowances']}, sort_keys=True))
          PY
      - name: Actual drift tests (failures remain failures)
        run: python -m pytest tests/test_deployment_drift.py tests/test_deployment_drift_studio.py -q --junitxml=diagnosis/tests.xml
      - name: Retain exact public source and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-quay-pr2207-drift-87251dcb
          retention-days: 14
          path: |
            diagnosis/
            deployment_drift.py
            deployment-drift.json
            deployment-drift.issue-1410.example.json
            tests/test_deployment_drift.py
            tests/test_deployment_drift_studio.py
            bottube_server.py
            studio_blueprint.py
            openapi.yaml
